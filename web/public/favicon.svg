<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" viewBox="0 0 48 48">
  <!-- Rounded background so the white details read on light and dark tabs -->
  <rect width="48" height="48" rx="11" fill="#17150F"/>
  <!-- Zed the automaton (matches src/components/ZedMascot.tsx) -->
  <g transform="translate(0 2.5) scale(0.9)">
    <!-- Antenna -->
    <line x1="24" y1="5" x2="24" y2="1" stroke="#F97316" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="24" cy="1" r="2" fill="#F97316"/>
    <!-- Ears -->
    <rect x="2"  y="17" width="7" height="13" rx="3.5" fill="#EA6C0A"/>
    <rect x="39" y="17" width="7" height="13" rx="3.5" fill="#EA6C0A"/>
    <!-- Head -->
    <rect x="8" y="6" width="32" height="35" rx="9" fill="#F97316"/>
    <!-- Left eye — non-final state -->
    <circle cx="17" cy="22" r="7" fill="#fff"/>
    <circle cx="17" cy="22" r="3" fill="#F97316"/>
    <!-- Right eye — final state (double ring) -->
    <circle cx="31" cy="22" r="7" fill="#fff"/>
    <circle cx="31" cy="22" r="5" fill="none" stroke="#F97316" stroke-width="2.4"/>
    <circle cx="31" cy="22" r="2" fill="#F97316"/>
    <!-- Mouth -->
    <rect x="15" y="32" width="18" height="3.2" rx="1.6" fill="#fff" opacity="0.85"/>
  </g>
</svg>
